media:
  - name: photos
    label: Photographs and article images
    input: assets/photos
    output: /assets/photos
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - gif
      - avif
    rename: safe
  - name: illustrations
    label: Article illustrations
    input: assets/illustrations
    output: /assets/illustrations
    extensions:
      - svg
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
content:
  - name: gallery
    label: Gallery order
    type: file
    path: content/gallery-order.json
    format: json
    fields:
      - name: images
        label: Drag event covers to reorder, then Save
        type: image
        description: Order runs left to right, then top to bottom. Select the cover
          image of each event or individual photo. Edit captions and event photos
          in Photo details. Unlisted published entries follow at the end.
        options:
          media: photos
          multiple: true
          unique: true
  - name: photos
    label: Photo details
    type: collection
    path: content/photos
    format: json
    filename: "{primary}.json"
    subfolders: false
    operations:
      rename: false
    view:
      primary: title
      fields:
        - image
        - title
        - date_label
        - published
      sort:
        - title
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Photo or event name
        type: string
        required: true
        description: A short title for this photograph or group of event photos.
      - name: image
        label: Cover photograph
        type: image
        required: true
        options:
          media: photos
      - name: additional_images
        label: More photos from this event
        type: image
        description: Optional. Add the separate originals here. The cover appears
          first; drag these thumbnails to set the remaining order. They open
          together as one event album and share the description below.
        options:
          media: photos
          multiple: true
          unique: true
      - name: caption
        label: Description
        type: text
        required: true
      - name: date_label
        label: Date or occasion
        type: string
        description: For example, 21 Jun 2025 or Railway Week 2018.
      - name: collection
        label: Collection
        type: select
        required: true
        options:
          values:
            - name: western
              label: Western Railway
            - name: jhansi
              label: Jhansi years
            - name: northeastern
              label: North Eastern Railway
            - name: eastcentral
              label: East Central Railway
            - name: life
              label: Beyond the rails
            - name: other
              label: Other moments
      - name: tags
        label: Also show in
        type: select
        description: Choose extra collections without duplicating the photos.
        options:
          multiple: true
          values:
            - name: people
              label: Key People
            - name: western
              label: Western Railway
            - name: jhansi
              label: Jhansi years
            - name: northeastern
              label: North Eastern Railway
            - name: eastcentral
              label: East Central Railway
            - name: life
              label: Beyond the rails
            - name: other
              label: Other moments
      - name: position
        label: Image focus
        type: select
        options:
          values:
            - center
            - top
            - bottom
            - left
            - right
            - center 65%
      - name: published
        label: Show on website
        type: boolean
        description: Published entries appear automatically at the end until
          positioned in Gallery order. Turn off to hide this whole photo or event.
  - name: articles
    label: Articles
    type: collection
    path: content/articles
    format: yaml-frontmatter
    filename: "{primary}.md"
    subfolders: false
    operations:
      rename: false
    view:
      primary: title
      fields:
        - title
        - order
        - published
      sort:
        - order
        - title
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Article title
        type: string
        required: true
      - name: excerpt
        label: Short introduction
        type: text
        required: true
        description: Shown on the home page and article list.
      - name: listing_excerpt
        label: Shorter introduction for article list
        type: text
        description: Optional. Leave blank to use the introduction above.
      - name: category
        label: Topic
        type: string
        description: For example, Observation, Education or Parenting. Matching
          topics are grouped together in the Thoughts filters.
      - name: cover
        label: Cover graphic
        type: image
        options:
          media: illustrations
        description: Upload a graphic or choose an existing illustration. Artwork is
          uploaded here, not generated automatically.
      - name: cover_alt
        label: Image description for accessibility
        type: string
        description: Describe meaningful visual content. Leave blank for a purely
          decorative graphic.
      - name: cover_motion
        label: Gentle cover animation
        type: boolean
        description: Animates details in the custom article illustrations, or adds a
          gentle camera movement to uploaded images. Artwork plays automatically
          when visible and respects reduced-motion preferences.
      - name: cover_caption
        label: Cover caption
        type: string
      - name: order
        label: Display order
        type: number
        required: true
        description: Lower numbers appear first. Every published article appears
          in the homepage article row and in Thoughts.
        options:
          min: 0
      - name: reading_minutes
        label: Reading time in minutes
        type: number
        description: Optional. Leave blank to calculate automatically from the article.
        options:
          min: 1
      - name: body
        label: Article
        type: rich-text
        required: true
        options:
          format: markdown
          media: photos
      - name: published
        label: Show on website
        type: boolean
        description: Turn on and save to publish. Turning off removes it from the
          website. This GitHub repository is public, so unpublished text is not
          private.
  - name: fitness
    label: Beyond the Rails
    type: file
    path: content/fitness.json
    format: json
    fields:
      - name: cycling_event
        label: Cycling event
        type: string
        required: true
      - name: cycling_detail
        label: Cycling year and edition
        type: string
        required: true
      - name: cycling_distance
        label: Cycling finish distance, in km
        type: number
        required: true
        options:
          min: 1
      - name: retirement_distance
        label: Retirement ride distance, in km
        type: number
        required: true
        options:
          min: 1
      - name: retirement_date
        label: Retirement ride date
        type: string
        required: true
      - name: runs
        label: Ten-kilometre finishes
        type: object
        list: true
        fields:
          - name: event
            label: Run name
            type: string
            required: true
          - name: year
            label: Year
            type: number
            required: true
            options:
              min: 1900
              max: 2100
      - name: cycling_photos
        label: Cycling photographs
        type: image
        description: Choose up to two existing published gallery covers. Captions,
          dates and visibility stay connected to Photo details.
        options:
          media: photos
          multiple: true
          unique: true
      - name: running_photos
        label: Running photographs
        type: image
        description: Choose up to two existing published gallery covers. Captions,
          dates and visibility stay connected to Photo details.
        options:
          media: photos
          multiple: true
          unique: true
