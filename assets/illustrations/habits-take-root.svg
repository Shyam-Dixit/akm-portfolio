<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" fill="none"><title>The lessons children copy</title><desc>Three linked scenes show the examples set at home: road rules observed from the back seat, words echoed by a child, and the contents of a school lunchbox.</desc><defs>
<linearGradient id="gold" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f0dca8"/><stop offset=".5" stop-color="#c8a66a"/><stop offset="1" stop-color="#947443"/></linearGradient>
<linearGradient id="enamel" x2="1" y2="1"><stop stop-color="#587c88"/><stop offset="1" stop-color="#183e56"/></linearGradient>
<linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffbef"/><stop offset="1" stop-color="#e9ddc0"/></linearGradient>
<pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#756e57" opacity=".12"/></pattern>
</defs><style>.lesson-car{animation:lesson-drive 12s ease-in-out infinite}.lesson-parent{animation:lesson-speak 12s ease-in-out infinite}.lesson-child{animation:lesson-echo 12s ease-in-out infinite}.lesson-lid{transform-origin:456px 166px;animation:lesson-pack 12s ease-in-out infinite}.lesson-link{stroke-dasharray:3 7;animation:lesson-link 18s linear infinite}
@keyframes lesson-drive{0%,10%,100%{transform:translateX(-7px)}30%,75%{transform:translateX(7px)}}@keyframes lesson-speak{0%,20%,100%{opacity:.3}32%,66%{opacity:1}}@keyframes lesson-echo{0%,35%,100%{opacity:.25}48%,80%{opacity:1}}@keyframes lesson-pack{0%,50%,100%{transform:rotate(0)}67%,82%{transform:rotate(-7deg)}}@keyframes lesson-link{to{stroke-dashoffset:-100}}@media(prefers-reduced-motion:reduce){svg *{animation:none!important}}</style><rect width="600" height="260" fill="#e4e8dc"/><rect width="600" height="260" fill="url(#grain)"/>
<g stroke="#34586b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
<!-- Each vignette comes from a specific example in the essay. -->
<rect x="42" y="38" width="162" height="184" rx="16" fill="#f7f2e7" stroke="#b9ad8d"/>
<rect x="219" y="38" width="162" height="184" rx="16" fill="#f7f2e7" stroke="#b9ad8d"/>
