<path d="M367 119v9m8-10v9" stroke="#d7b48d" stroke-width="5"/>
<ellipse cx="370" cy="108" rx="10" ry="13" fill="#e6c5a1"/>
<path d="M360 107c-4-11 4-21 14-17 8 3 10 10 7 15-8-1-12-2-16-6-1 4-2 6-5 8Z" fill="#43586b"/>
<path d="m377 109 1 5h-3m-8 7c3 1 6 0 8-2" stroke-width=".8"/>
<path d="m382 134 10-14-9-2" stroke="#e6c5a1" stroke-width="6"/><path d="m382 134 5-7" stroke="#b2c3a3" stroke-width="10"/>
<path d="m357 139-8 12" stroke="#e6c5a1" stroke-width="6"/>
<path d="M350 194h9m33-20h9m11-18h8m31-3h9" stroke="#43586b" stroke-width="3"/>
<!-- Growth without another test. -->
<path d="M499 214v-67" stroke="#809473" stroke-width="2"/>
<g class="rank-leaves" fill="#acbd9d" stroke="#809473"><path d="M499 171c-18 0-28-13-23-27 15 0 27 11 23 27Zm0 17c1-20 13-31 30-28 0 17-12 28-30 28Zm0-33c-10-13-10-27 1-36 12 9 11 25-1 36Z"/><path d="m484 153 15 18m21-3-21 20" stroke-width=".8"/></g>
<path d="M483 215h32m-159-5h9" stroke="#a99b73" opacity=".5"/>
</g></svg>