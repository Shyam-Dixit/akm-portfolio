<path d="M424 68v10m8-10v10" stroke="#d7b48d" stroke-width="5"/>
<ellipse cx="428" cy="59" rx="11" ry="14" fill="#e6c5a1"/>
<path d="M417 59c-6-14 6-23 16-18 8 4 9 11 6 16-8-1-12-3-15-7-1 5-3 7-7 9Z" fill="#43586b"/>
