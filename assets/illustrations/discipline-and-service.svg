<path class="service-span" d="M290 149V99h210v50m-210 0 35-50 35 50 35-50 35 50 35-50 35 50m-175-50v50m35-50v50m35-50v50m35-50v50m35-50v50" stroke="#e0c381" stroke-width="2.2"/>
