<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" fill="none"><title>From preparation to public service</title><desc>An engineering notebook becomes a bridge supported by sincerity and discipline. A worked drawing turns into a complete span, linking examination preparation with a career of responsibility.</desc><defs>
<linearGradient id="gold" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f0dca8"/><stop offset=".5" stop-color="#c8a66a"/><stop offset="1" stop-color="#947443"/></linearGradient>
<linearGradient id="enamel" x2="1" y2="1"><stop stop-color="#587c88"/><stop offset="1" stop-color="#183e56"/></linearGradient>
<linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffbef"/><stop offset="1" stop-color="#e9ddc0"/></linearGradient>
<pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#756e57" opacity=".12"/></pattern>
</defs><style>.service-span{stroke-dasharray:290;animation:service-build 14s ease-in-out infinite}.service-water{stroke-dasharray:26 12;animation:service-water 15s linear infinite}.service-check{stroke-dasharray:18;animation:service-check 14s ease-in-out infinite}.service-clock{transform-origin:168px 63px;animation:service-clock 90s linear infinite}.service-page{transform-origin:211px 182px;animation:service-page 10s ease-in-out infinite}
@keyframes service-build{0%,8%{stroke-dashoffset:290;opacity:.3}48%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.3}}@keyframes service-water{to{stroke-dashoffset:-76}}@keyframes service-check{0%,38%{stroke-dashoffset:18}60%,100%{stroke-dashoffset:0}}@keyframes service-clock{to{transform:rotate(360deg)}}@keyframes service-page{0%,100%{transform:skewY(0)}50%{transform:skewY(-2deg)}}@media(prefers-reduced-motion:reduce){svg *{animation:none!important}}</style><rect width="600" height="260" fill="#173e55"/><rect width="600" height="260" fill="url(#grain)"/>
<defs><pattern id="blueprint" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0v18" stroke="#9bb5ba" stroke-width=".4" opacity=".16"/></pattern></defs>
<rect x="28" y="21" width="544" height="218" rx="12" fill="url(#blueprint)" stroke="#76919c" stroke-opacity=".3"/>
<g stroke="#c5cfbe" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
<!-- The pages carry a worked engineering problem, not a certificate. -->
