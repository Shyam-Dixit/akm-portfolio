<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" fill="none"><title>The first classroom is a home</title><desc>A warm cutaway house rests on an open book. Inside, a parent and child share a reading table; the child writes while the lamp glows and a page turns.</desc><defs>
<linearGradient id="gold" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f0dca8"/><stop offset=".5" stop-color="#c8a66a"/><stop offset="1" stop-color="#947443"/></linearGradient>
<linearGradient id="enamel" x2="1" y2="1"><stop stop-color="#587c88"/><stop offset="1" stop-color="#183e56"/></linearGradient>
<linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffbef"/><stop offset="1" stop-color="#e9ddc0"/></linearGradient>
<pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#756e57" opacity=".12"/></pattern>
</defs><style>.home-lamplight{animation:home-light 7s ease-in-out infinite}.home-writing{stroke-dasharray:28;animation:home-write 8s ease-in-out infinite}.home-pencil{transform-origin:336px 173px;animation:home-pencil 8s ease-in-out infinite}.home-page{transform-origin:302px 187px;animation:home-page 8s ease-in-out infinite}.foundation-page{transform-origin:300px 224px;animation:foundation 10s ease-in-out infinite}.house-curtain{transform-origin:394px 79px;animation:curtain 9s ease-in-out infinite}
@keyframes home-light{0%,100%{opacity:.16}50%{opacity:.38}}@keyframes home-write{0%,12%{stroke-dashoffset:28}65%,95%{stroke-dashoffset:0}100%{stroke-dashoffset:28}}@keyframes home-pencil{0%,100%{transform:rotate(0)}40%,65%{transform:translate(-3px,1px) rotate(4deg)}}@keyframes home-page{0%,100%{transform:skewY(0)}50%{transform:skewY(-3deg)}}@keyframes foundation{0%,100%{transform:skewY(0)}50%{transform:skewY(-1.5deg)}}@keyframes curtain{0%,100%{transform:skewX(0)}50%{transform:skewX(-3deg)}}@media(prefers-reduced-motion:reduce){svg *{animation:none!important}}</style><rect width="600" height="260" fill="#ede2cf"/><rect width="600" height="260" fill="url(#grain)"/>
